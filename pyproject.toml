[project]
name = "automacao-selenium"
version = "0.1.0"
description = "Automacao Selenium para documentos"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.4",
    "apscheduler>=3.11.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",
    "selenium>=4.35.0",
    "sqlalchemy>=2.0.43",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = ["mypy>=1.17.1", "pytest>=8.4.1", "pytest-asyncio>=1.1.0", "ruff>=0.12.9"]
